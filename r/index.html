<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A recipe for you · Meals Made Easy</title>
<!-- Open Graph: a static page can't have per-recipe tags, so link previews outside iMessage show
     this generic card. (iMessage shows the meal photo because the app attaches it when sharing.) -->
<meta property="og:title" content="A recipe for you · Meals Made Easy">
<meta property="og:description" content="Tap to add this recipe to Meals Made Easy.">
<meta property="og:image" content="https://molnar680.github.io/r/app-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Meals Made Easy">
<meta name="twitter:card" content="summary">
<meta name="apple-itunes-app" content="app-id=6746574491">
<style>
  :root { --coral:#FF6B6B; --tang:#FF9F43; --mint:#1DD1A1; --grape:#A55EEA; --sky:#54A0FF; }
  * { box-sizing:border-box }
  body { margin:0; font-family:ui-rounded,-apple-system,system-ui,sans-serif; background:#f2f2f7; color:#1c1c1e }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px }
  .banner { background:linear-gradient(135deg,var(--coral),var(--tang)); color:#fff; font-weight:600; padding:10px 14px; border-radius:14px }
  .hero { position:relative; margin-top:14px; border-radius:24px; overflow:hidden; min-height:180px; background:linear-gradient(135deg,var(--coral),var(--tang)) }
  .hero img { display:block; width:100%; height:260px; object-fit:cover }
  .hero h1 { position:absolute; left:0; right:0; bottom:0; margin:0; padding:40px 16px 16px; color:#fff; font-size:28px; font-weight:800;
             background:linear-gradient(transparent,rgba(0,0,0,.55)) }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 }
  .chip { padding:6px 12px; border-radius:999px; font-weight:600; font-size:14px; background:rgba(84,160,255,.14); color:var(--sky) }
  .chip.cat { background:var(--tang); color:#fff }
  .card { background:#fff; border-radius:22px; padding:16px; margin-top:12px }
  .card h2 { margin:0 0 10px; font-size:17px }
  .ing h2 { color:var(--mint) } .ins h2 { color:var(--grape) }
  ul { margin:0; padding-left:20px } li { margin:6px 0 }
  .ins p { white-space:pre-wrap; margin:0 }
  .cta { text-align:center; margin-top:22px }
  .cta p { color:#6e6e73; font-size:15px }
  .badge img { height:54px }
  .open { display:inline-block; margin-top:10px; color:var(--coral); font-weight:600; text-decoration:none }
  .msg { text-align:center; padding:60px 10px; color:#6e6e73 }
  @media (prefers-color-scheme: dark) { body { background:#000; color:#f2f2f7 } .card { background:#1c1c1e } }
</style>
</head>
<body>
<main id="app"><div class="msg">Loading recipe…</div></main>
<script>
// ====== SETTINGS ======
// TODO(Andrew): create an API token in CloudKit Console → iCloud.com.andrewmolnar2.MealsMadeEasy →
// Settings → Tokens & Keys → API Tokens (Production, sign-in: none) and paste it here.
const CLOUDKIT_API_TOKEN = "a30bba9d1fd17fe0bc1974ae35859f3bf090993d874331d64f18f56cf51c8b1b";
const CONTAINER = "iCloud.com.andrewmolnar2.MealsMadeEasy";
const ENVIRONMENT = "production";   // use "development" only while testing a TestFlight/Xcode build
const APP_STORE_URL = "https://apps.apple.com/us/app/meals-made-easy-meal-planner/id6746574491";
// ======================

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const badge = `<div class="cta"><p>Get Meals Made Easy to save this recipe to your meals in one tap.</p>
  <a class="badge" href="${APP_STORE_URL}"><img alt="Download on the App Store"
   src="https://tools.applemarketingtools.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"></a><br>
  <a class="open" id="openApp" href="#">Already have the app? Open it</a></div>`;

function showMessage(title, text) {
  app.innerHTML = `<div class="msg"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>` + badge;
  wireOpen();
}
function wireOpen() {
  const a = document.getElementById("openApp");
  if (a && id) a.href = "mealsmadeeasy://r?id=" + encodeURIComponent(id);
}

const id = new URLSearchParams(location.search).get("id");
(async () => {
  if (!id || !/^[A-Za-z0-9-]{5,64}$/.test(id)) return showMessage("Recipe not found", "This link looks incomplete.");
  try {
    const url = `https://api.apple-cloudkit.com/database/1/${CONTAINER}/${ENVIRONMENT}/public/records/lookup?ckAPIToken=${encodeURIComponent(CLOUDKIT_API_TOKEN)}`;
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify({ records: [{ recordName: id }] }) });
    const data = await res.json();
    const rec = data.records && data.records[0];
    if (!rec || rec.serverErrorCode || !rec.fields) return showMessage("Recipe not found", "This recipe link isn't available anymore. Ask the sender to share it again.");
    const f = rec.fields;
    if (f.expiresAt && f.expiresAt.value < Date.now()) return showMessage("Link expired", "Shared recipes last 30 days. Ask the sender to share it again.");
    const p = JSON.parse(f.payload.value), m = p.meal || {};
    const photo = f.photo && f.photo.value && f.photo.value.downloadURL ? f.photo.value.downloadURL.replace("${f}", "photo.jpg") : null;
    const sender = (f.senderName && f.senderName.value) || "";
    document.title = `${m.mealName} · Meals Made Easy`;
    const chips = [m.selectedCategory ? `<span class="chip cat">${esc(m.selectedCategory)}</span>` : "",
                   m.prepMinutes ? `<span class="chip">${esc(m.prepMinutes)} min</span>` : "",
                   m.servings ? `<span class="chip">Serves ${esc(m.servings)}</span>` : ""].join("");
    app.innerHTML = `
      <div class="banner">🎁 ${sender ? "Shared by " + esc(sender) : "Shared with you"}</div>
      <div class="hero">${photo ? `<img src="${esc(photo)}" alt="">` : ""}<h1>${esc(m.mealName)}</h1></div>
      <div class="chips">${chips}</div>
      ${(m.ingredients || []).length ? `<div class="card ing"><h2>Ingredients</h2><ul>${m.ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
      ${m.recipeDetails ? `<div class="card ins"><h2>Instructions</h2><p>${esc(m.recipeDetails)}</p></div>` : ""}
      ${m.urlString && /^https?:\/\//i.test(m.urlString) ? `<div class="card"><a href="${esc(m.urlString)}">Open original recipe link</a></div>` : ""}
      ${badge}`;
    wireOpen();
  } catch (e) {
    showMessage("Couldn't load the recipe", "Check your internet connection and try again.");
  }
})();
</script>
</body>
</html>
